name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test helpers and installer
        run: python3 -B -m unittest discover -s tests -v
      - name: Check shell and property-list syntax
        run: |
          for script in scripts/*.sh config/*.sh config/yabairc; do sh -n "$script"; done
          plutil -lint app/Info.plist
      - name: Build and test native app
        run: |
          sh scripts/build.sh
          build/YabaiSpaces.app/Contents/MacOS/YabaiSpaces --self-test
          codesign --verify --strict build/YabaiSpaces.app
